# Fast convention checks on the governance config; runs before the
# token-backed dry-run jobs and needs no credentials.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7 # linux_x64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python3 -m pip install --quiet pyyaml==6.0.3 pre-commit==4.7.0
      # Same hooks and pins as local clones: ruff, shuck, the governance lint (Betterleaks'
      # staged-only hook is a no-op here; the full-history scan is below).
      - name: pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: inference-gateway render tests
        run: python3 -m unittest discover -s inference-gateway
      - name: inference-gateway config (agentgateway --validate-only, pinned digest)
        run: |
          set -euo pipefail
          envs=$(python3 inference-gateway/render.py --print-env)
          eval "$envs"
          v=$(mktemp -d)
          mkdir -p "$v/config" "$v/upstream"
          cp inference-gateway/config.yaml "$v/config/"
          printf x > "$v/upstream/key"
          chmod -R a+rX "$v"
          docker run --rm -v "$v/config:/etc/agw-config:ro" -v "$v/upstream:/etc/agw-upstream:ro" \
            "ghcr.io/agentgateway/agentgateway@sha256:$DIGEST" \
            -f /etc/agw-config/config.yaml --validate-only
      - name: secret scan (Betterleaks, full history)
        run: |
          set -euo pipefail
          tgz="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$tgz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$tgz"
          echo "${BETTERLEAKS_SHA256}  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /tmp betterleaks
          /tmp/betterleaks git --redact --verbose --no-banner .
