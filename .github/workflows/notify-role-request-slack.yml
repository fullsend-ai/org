# Slack notification for triage/write/maintainer role requests, replacing
# the triage/write branches of fullsend's notify-vouch-slack.yml now that
# role requests are issues here instead of discussions in fullsend.
name: Notify Slack on role request

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: >-
      contains(github.event.issue.labels.*.name, 'triage-request') ||
      contains(github.event.issue.labels.*.name, 'write-request') ||
      contains(github.event.issue.labels.*.name, 'maintainer-request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is not configured"
            exit 1
          fi

          if [[ ! "$ISSUE_AUTHOR" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "::error::Invalid username received"
            exit 1
          fi

          if [[ ! "$ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/issues/[0-9]+$ ]]; then
            echo "::error::Invalid issue URL received"
            exit 1
          fi

          case "$ISSUE_LABELS" in
            *triage-request*)
              request_label="triage request"
              request_emoji="🔎"
              request_context="Review the request, then add the requester to the triagers team in peribolos.yaml."
              ;;
            *write-request*)
              request_label="write request"
              request_emoji="✍️"
              request_context="Review the request (2 maintainer approvals), then add the requester to the writers team in peribolos.yaml."
              ;;
            *maintainer-request*)
              request_label="maintainer nomination"
              request_emoji="🛠️"
              request_context="Review the nomination (maintainer consensus), then add the requester to the maintainers team in peribolos.yaml."
              ;;
            *)
              echo "::error::Invalid role request label received"
              exit 1
              ;;
          esac

          payload=$(jq -n \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            --arg label "$request_label" \
            --arg emoji "$request_emoji" \
            --arg context "$request_context" \
            '{
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ($emoji + " *New " + $label + "* from *" + $author + "* — <" + $url + "|View issue>")
                  }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: $context
                    }
                  ]
                }
              ]
            }')

          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"
