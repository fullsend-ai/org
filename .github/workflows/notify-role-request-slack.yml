# Notify on opened/edited/labeled requests or manual dispatch; mark successful sends.
# Pre-rollout issues require manual backfill to avoid repeating legacy deliveries.
name: Notify Slack on role request

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing role request to notify (already notified requests are skipped)
        required: true
        type: number

permissions: {}

concurrency:
  group: role-request-slack-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'fullsend-ai/org' &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'triage-request' ||
      github.event.label.name == 'write-request' ||
      github.event.label.name == 'maintainer-request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # first-parent history determines when this notifier was deployed
      - name: Send Slack notification
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/notify_role_request.py
