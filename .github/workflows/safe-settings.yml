# Repo configuration via safe-settings full-sync (config at the repo root).
# PRs run dry; merges to main and the daily schedule apply.
name: safe-settings

on:
  push:
    branches: [main]
    paths: ['settings.yml', 'repos/**', 'deployment-settings.yml']
  # All PRs, unfiltered: the .github ruleset requires this check on every
  # pull request; a path-filtered trigger would leave it missing and block
  # merges. Fork PRs skip the job (no token) and need an admin bypass.
  pull_request:
  schedule:
    - cron: '0 7 * * *' # daily reconcile against drift
  workflow_dispatch:

permissions:
  contents: read

env:
  SAFE_SETTINGS_VERSION: '3.0.0'
  SAFE_SETTINGS_CODE_DIR: ${{ github.workspace }}/.safe-settings-code
  # Points safe-settings at our deployment config; the default
  # restrictedRepos list would skip the `.github` repo itself.
  DEPLOYMENT_CONFIG_FILE: ${{ github.workspace }}/deployment-settings.yml

jobs:
  # Skipped on fork PRs: they cannot mint the App token.
  safe-settings-dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github-community-projects/safe-settings
          ref: ${{ env.SAFE_SETTINGS_VERSION }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.SAFE_SETTINGS_CODE_DIR }}/.nvmrc
      - run: npm install
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          GH_ORG: fullsend-ai
          APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GOVERNANCE_PRIVATE_KEY }}
          ADMIN_REPO: org
          CONFIG_PATH: .
          FULL_SYNC_NOP: 'true'

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github-community-projects/safe-settings
          ref: ${{ env.SAFE_SETTINGS_VERSION }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.SAFE_SETTINGS_CODE_DIR }}/.nvmrc
      - run: npm install
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          GH_ORG: fullsend-ai
          APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GOVERNANCE_PRIVATE_KEY }}
          ADMIN_REPO: org
          CONFIG_PATH: .
