# Snapshotted from the live ruleset (2026-10-23).
# Environments are total-state: unlisted ones are deleted on apply.
environments:
- name: dev
- name: e2e-org-pool
  # safe-settings cannot manage environment secrets; these three live only on
  # GitHub (write-only via the API): TEST_ACTOR_TRIAGE_PAT,
  # TEST_ACTOR_WRITE_PAT, TEST_BOTSEND_PAT.
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies:
    - main
- name: evals
- name: forgejo-dev
- name: forgejo-stage
- name: functional-tests
- name: github-pages
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies:
    - main
- name: site-preview
- name: site-production
- name: stage

rulesets:
- name: main
  target: branch
  enforcement: active
  conditions:
    ref_name:
      include:
      - ~DEFAULT_BRANCH
      exclude: []
  bypass_actors:
  - actor_id: 4113971 # renovate-fullsend
    actor_type: Integration
    bypass_mode: always
  - actor_id: 4648700 # fullsend-ai-sync
    actor_type: Integration
    bypass_mode: always
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: pull_request
    parameters:
      required_approving_review_count: 1
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: true
      require_last_push_approval: false
      required_review_thread_resolution: true
      require_extra_approval_for_unattributed_changes: true
      dismissal_restriction:
        enabled: false
        allowed_actors: []
      required_reviewers: []
      allowed_merge_methods:
      - merge
      - squash
      - rebase
  - type: merge_queue
    parameters:
      merge_method: MERGE
      # The behaviour test pool (halfsend-01..22) carries about 3 E2E suites
      # at once; 5 merge groups plus pull-request runs exhaust its API quota.
      max_entries_to_build: 3
      min_entries_to_merge: 1
      max_entries_to_merge: 3
      min_entries_to_merge_wait_minutes: 5
      grouping_strategy: ALLGREEN
      check_response_timeout_minutes: 60
  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      required_status_checks:
      - context: behaviour
        integration_id: 15368 # GitHub Actions
      - context: behaviour-github-emulator
        integration_id: 15368 # GitHub Actions
      - context: playback
        integration_id: 15368 # GitHub Actions
      - context: semgrep
        integration_id: 15368 # GitHub Actions
