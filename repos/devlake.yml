# Snapshotted from the live ruleset (2026-10-23). The org baseline
# (settings.yml default-branch) now protects main: no deletion, no force
# push, changes through PRs. This stricter repo ruleset (1 approval,
# required signatures) stays disabled until the devlake owners opt in.
rulesets:
- name: protect main
  target: branch
  enforcement: disabled
  conditions:
    ref_name:
      include:
      - ~DEFAULT_BRANCH
      exclude: []
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: pull_request
    parameters:
      required_approving_review_count: 1
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: false
      require_extra_approval_for_unattributed_changes: true
      dismissal_restriction:
        enabled: false
        allowed_actors: []
      required_reviewers: []
      allowed_merge_methods: [merge, squash, rebase]
  - type: required_signatures
